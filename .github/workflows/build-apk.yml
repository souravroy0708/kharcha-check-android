name: Build, test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KC_KEYSTORE_BASE64 secret. Building with the debug key (not uploadable to Play)."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KC_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (statement parser accuracy, reports, gamification, crypto, export)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        env:
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PcompressNativeLibs --console=plain

      # Google Play needs an .aab. Only built with your real key: Play rejects debug-signed bundles.
      - name: Build signed Play bundles (.aab)
        if: env.KC_KEYSTORE_PATH != ''
        env:
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --console=plain

      - name: Warn when no Play bundle was built
        if: env.KC_KEYSTORE_PATH == ''
        run: echo "::warning::No .aab built. Run ./scripts/setup-signing.sh to add the KC_KEYSTORE_* secrets."

      - name: Privacy gate (fails the build if a permission sneaks in)
        run: |
          set -e
          m=$(find app/build/intermediates/merged_manifest -path "*release*" -name AndroidManifest.xml | head -n1)
          echo "Checking: $m"
          [ -f "$m" ] || { echo "::error::Merged release manifest not found"; exit 1; }
          # Internet is allowed (AMFI fund prices). SMS, advertising IDs, location and contacts never are.
          if grep -q 'READ_SMS"\|RECEIVE_SMS"\|SEND_SMS"\|RECEIVE_MMS"\|RECEIVE_WAP_PUSH"\|READ_CALL_LOG"\|WRITE_CALL_LOG"\|PROCESS_OUTGOING_CALLS"' "$m"; then echo "::error::SMS or call log permission found: the app must never read messages or calls"; exit 1; fi
          if grep -q 'AD_ID"' "$m"; then echo "::error::AD_ID found"; exit 1; fi
          if grep -q 'ACCESS_FINE_LOCATION"\|ACCESS_COARSE_LOCATION"\|READ_CONTACTS"' "$m"; then echo "::error::location or contacts permission found"; exit 1; fi
          # Voice typing goes through Android's own speech screen, so the app must never need the microphone.
          if grep -q 'RECORD_AUDIO"' "$m"; then echo "::error::RECORD_AUDIO found: voice typing must use RecognizerIntent, not the mic"; exit 1; fi
          grep -q 'cleartextTrafficPermitted\|networkSecurityConfig' "$m" || { echo "::error::HTTPS-only network config missing"; exit 1; }
          echo "✓ No SMS, no call log, no mic, no ad id, no location/contacts, HTTPS-only."

      # Users have real data. A table change without a version bump + migration would crash the app on launch.
      - name: Database schema guard
        run: |
          changed=$(git status --porcelain -- app/schemas | grep -v '^??' || true)
          untracked=$(git status --porcelain -- app/schemas | grep '^??' || true)
          if [ -n "$changed" ]; then
            echo "::error::The database schema changed but its version did not. Bump the version in KharchaDatabase, add a Migration to MIGRATIONS, and commit the new schema JSON. See docs/DATABASE.md."
            git --no-pager diff --stat -- app/schemas
            exit 1
          fi
          if [ -n "$untracked" ]; then
            echo "::warning::New database schema file(s) not committed yet: $untracked — download the 'room-schema' artifact and commit it to app/schemas/ so future changes are checked."
          fi
          echo "✓ Database schema unchanged or properly versioned."

      - name: Android Lint (report only)
        continue-on-error: true
        run: ./gradlew lintRelease --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Name outputs
        run: |
          V=2.0.${{ github.run_number }}
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/KharchaCheck-$V.apk"
          cp "out/KharchaCheck-$V.apk" out/KharchaCheck.apk
          if [ -n "${KC_KEYSTORE_PATH:-}" ]; then
            cp app/build/outputs/bundle/release/*.aab "out/KharchaCheck-$V.aab"
          fi
          ls -la out

      # Smaller download for almost every phone in use today (64-bit ARM). Separate build because it changes the ABI list.
      - name: Build arm64-only APK
        env:
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PcompressNativeLibs -PapkAbi=arm64-v8a --console=plain
          cp app/build/outputs/apk/release/*.apk "out/KharchaCheck-2.0.${{ github.run_number }}-arm64.apk"
          echo "APK sizes:"; ls -la out/*.apk

      - name: Upload Play bundles (.aab)
        if: env.KC_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: KharchaCheck-play-bundles-2.0.${{ github.run_number }}
          path: out/*.aab
          retention-days: 30

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KharchaCheck-apks-2.0.${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      # Lets Play Console show readable crash stack traces (upload mapping.txt with the bundle if Play asks)
      - name: Upload R8 mapping files
        uses: actions/upload-artifact@v4
        with:
          name: KharchaCheck-mapping-2.0.${{ github.run_number }}
          path: app/build/outputs/mapping/
          retention-days: 90

      - name: Publish GitHub Release (signed builds on main only)
        if: success() && env.KC_KEYSTORE_PATH != '' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Kharcha Check 2.0.${{ github.run_number }}
          make_latest: true
          files: |
            out/KharchaCheck.apk
            out/KharchaCheck-2.0.${{ github.run_number }}-arm64.apk
          body: |
            **Kharcha Check: Paisa kahan gaya? Ab pata chalega.**
            Private expense tracker. No internet permission, no account, encrypted on your phone.
            **Install:** download `KharchaCheck-…-arm64.apk` (smallest, fits almost every phone from the last ~7 years).
            If it says "App not installed" on an older phone, use `KharchaCheck.apk` (works on all phones).

      - name: Upload Room schema (commit it so future migrations can be tested)
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/
          retention-days: 30

      - name: Upload build reports (only when the build fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
          retention-days: 7
