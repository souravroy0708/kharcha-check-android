name: Build APK and Play bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KC_KEYSTORE_BASE64 secret. Building with the debug key (fine for testing, not for Play upload)."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KC_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests (SMS golden set)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        env:
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/KharchaCheck-v1.0.${{ github.run_number }}.apk"
          cp "app/build/outputs/apk/release/KharchaCheck-v1.0.${{ github.run_number }}.apk" app/build/outputs/apk/release/KharchaCheck.apk

      - name: Build release bundle (.aab) for Google Play
        env:
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --console=plain
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/KharchaCheck-v1.0.${{ github.run_number }}.aab"

      - name: Verify merged release manifest has zero INTERNET permission
        run: |
          MANIFEST=$(find app/build/intermediates -path "*merged_manifest*" -path "*elease*" -name "AndroidManifest.xml" | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::Could not find the merged release manifest."
            exit 1
          fi
          echo "Checking merged manifest: $MANIFEST"
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "::error::PRIVACY VIOLATION: Merged release manifest contains android.permission.INTERNET!"
            exit 1
          fi
          echo "Verified: Zero android.permission.INTERNET in merged release manifest."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KharchaCheck-apk-v1.0.${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Play bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: KharchaCheck-play-bundle-v1.0.${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

      - name: Publish GitHub Release (signed builds on main only)
        if: success() && env.KC_KEYSTORE_PATH != '' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kharcha Check 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            app/build/outputs/apk/release/KharchaCheck.apk
            app/build/outputs/apk/release/KharchaCheck-v1.0.${{ github.run_number }}.apk
            app/build/outputs/bundle/release/KharchaCheck-v1.0.${{ github.run_number }}.aab
          body: |
            **Kharcha Check | 100% on-device expense tracker.**
            No accounts, no servers, and ships without the INTERNET permission.
