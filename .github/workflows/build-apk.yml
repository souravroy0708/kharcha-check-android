name: Build, test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KC_KEYSTORE_BASE64 secret. Building with the debug key (not uploadable to Play)."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KC_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (SMS golden set, report maths, gamification, crypto)
        run: |
          chmod +x gradlew
          ./gradlew testStandardDebugUnitTest --console=plain

      - name: Build release APKs (standard and smart)
        env:
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: ./gradlew assembleStandardRelease assembleSmartRelease assembleSmartDebug -PcompressNativeLibs --console=plain

      # Google Play needs an .aab. Only built with your real key: Play rejects debug-signed bundles.
      - name: Build signed Play bundles (.aab)
        if: env.KC_KEYSTORE_PATH != ''
        env:
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: ./gradlew bundleStandardRelease bundleSmartRelease --console=plain

      - name: Warn when no Play bundle was built
        if: env.KC_KEYSTORE_PATH == ''
        run: echo "::warning::No .aab built. Run ./scripts/setup-signing.sh to add the KC_KEYSTORE_* secrets."

      - name: Privacy gate (fails the build if a permission sneaks in)
        run: |
          set -e
          check() {
            local flavor=$1
            local m=$(find app/build/intermediates/merged_manifest -path "*${flavor}Release*" -name AndroidManifest.xml | head -n1)
            echo "Checking $flavor: $m"
            [ -f "$m" ] || { echo "::error::Merged manifest for $flavor not found"; exit 1; }
            # Internet is allowed (AMFI fund prices). Advertising IDs and location never are.
            if grep -q 'AD_ID"' "$m"; then echo "::error::$flavor has AD_ID"; exit 1; fi
            if grep -q 'ACCESS_FINE_LOCATION"\|ACCESS_COARSE_LOCATION"\|READ_CONTACTS"' "$m"; then echo "::error::$flavor requests location or contacts"; exit 1; fi
            grep -q 'cleartextTrafficPermitted\|networkSecurityConfig' "$m" || { echo "::error::$flavor lost its HTTPS-only network config"; exit 1; }
            echo "$m"
          }
          STD=$(check standard | tail -n1)
          SMART=$(check smart | tail -n1)
          if grep -q 'READ_SMS\|RECEIVE_SMS' "$STD"; then echo "::error::standard edition must not request SMS permissions"; exit 1; fi
          grep -q 'READ_SMS' "$SMART" || { echo "::error::smart edition is missing READ_SMS"; exit 1; }
          echo "✓ Both editions: no ad id, no location/contacts, HTTPS-only. Standard: no SMS."

      - name: Name outputs
        run: |
          V=2.0.${{ github.run_number }}
          mkdir -p out
          cp app/build/outputs/apk/standard/release/*.apk "out/KharchaCheck-$V-standard.apk"
          cp app/build/outputs/apk/smart/release/*.apk "out/KharchaCheck-$V-smart.apk"
          cp "out/KharchaCheck-$V-standard.apk" out/KharchaCheck.apk
          # Developer test build of the SMS edition: separate package ("Kharcha Check Test"), installs next to the real app.
          # Install it with: adb install -r KharchaCheck-<ver>-smart-TEST.apk  (Play Protect blocks SMS apps sideloaded from WhatsApp/browsers in India)
          cp app/build/outputs/apk/smart/debug/*.apk "out/KharchaCheck-$V-smart-TEST.apk"
          if [ -n "${KC_KEYSTORE_PATH:-}" ]; then
            cp app/build/outputs/bundle/standardRelease/*.aab "out/KharchaCheck-$V-standard.aab"
            cp app/build/outputs/bundle/smartRelease/*.aab "out/KharchaCheck-$V-smart.aab"
          fi
          ls -la out

      # Smaller download for almost every phone in use today (64-bit ARM). Separate build because it changes the ABI list.
      - name: Build arm64-only APK
        env:
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: |
          ./gradlew assembleStandardRelease -PcompressNativeLibs -PapkAbi=arm64-v8a --console=plain
          cp app/build/outputs/apk/standard/release/*.apk "out/KharchaCheck-2.0.${{ github.run_number }}-arm64.apk"
          echo "APK sizes:"; ls -la out/*.apk

      - name: Upload Play bundles (.aab)
        if: env.KC_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: KharchaCheck-play-bundles-2.0.${{ github.run_number }}
          path: out/*.aab
          retention-days: 30

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KharchaCheck-apks-2.0.${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      # Lets Play Console show readable crash stack traces (upload mapping.txt with the bundle if Play asks)
      - name: Upload R8 mapping files
        uses: actions/upload-artifact@v4
        with:
          name: KharchaCheck-mapping-2.0.${{ github.run_number }}
          path: app/build/outputs/mapping/
          retention-days: 90

      - name: Publish GitHub Release (signed builds on main only)
        if: success() && env.KC_KEYSTORE_PATH != '' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Kharcha Check 2.0.${{ github.run_number }}
          make_latest: true
          files: |
            out/KharchaCheck.apk
            out/KharchaCheck-2.0.${{ github.run_number }}-arm64.apk
          body: |
            **Kharcha Check: Paisa kahan gaya? Ab pata chalega.**
            Private expense tracker. No internet permission, no account, encrypted on your phone.
            **Install:** download `KharchaCheck-…-arm64.apk` (smallest, fits almost every phone from the last ~7 years).
            If it says "App not installed" on an older phone, use `KharchaCheck.apk` (works on all phones).
            Automatic bank-SMS reading arrives through the Play Store once Google approves it.

      - name: Upload Room schema (commit it so future migrations can be tested)
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/
          retention-days: 30

      - name: Upload build reports (only when the build fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
          retention-days: 7
