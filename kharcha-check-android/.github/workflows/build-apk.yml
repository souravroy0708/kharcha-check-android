name: Build APK and Play bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KC_KEYSTORE_BASE64 secret. Building with debug key."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KC_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run SMS Parser Golden Set Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Build signed release APK
        env:
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/KharchaCheck-v1.0.${{ github.run_number }}.apk"
          cp "app/build/outputs/apk/release/KharchaCheck-v1.0.${{ github.run_number }}.apk" app/build/outputs/apk/release/KharchaCheck.apk

      - name: Verify merged release manifest has zero INTERNET permission (Spec Page 9 Privacy Gate)
        run: |
          MANIFEST="app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            MANIFEST=$(find app/build/intermediates/merged_manifest -name "AndroidManifest.xml" | head -n 1)
          fi
          echo "Checking merged manifest: $MANIFEST"
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "::error::PRIVACY VIOLATION: Merged release manifest contains android.permission.INTERNET!"
            exit 1
          fi
          echo "Verified: Zero android.permission.INTERNET in merged release manifest."

      - name: Build signed release bundle (.aab) for Google Play
        if: env.KC_KEYSTORE_PATH != ''
        env:
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --console=plain
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/KharchaCheck-v1.0.${{ github.run_number }}.aab"

      - name: Warn when no Play bundle was built
        if: env.KC_KEYSTORE_PATH == ''
        run: echo "::warning::No .aab built. Run ./scripts/setup-signing.sh to configure KC_KEYSTORE_* secrets."

      - name: Upload Play bundle (.aab)
        if: env.KC_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: KharchaCheck-play-bundle-v1.0.${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KharchaCheck-v1.0.${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release (signed builds on main only)
        if: success() && env.KC_KEYSTORE_PATH != '' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kharcha Check 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            app/build/outputs/apk/release/KharchaCheck.apk
            app/build/outputs/apk/release/KharchaCheck-v1.0.${{ github.run_number }}.apk
          body: |
            **Kharcha Check — Paisa kahan gaya, ab pata chalega.**
            100% On-Device Expense Tracker. Ships **without the INTERNET permission** (verifiable in Android Settings -> Apps -> Kharcha Check -> Permissions).

      - name: Upload build reports (only when the build fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/intermediates/lint_vital_intermediate_text_report/
          retention-days: 7
